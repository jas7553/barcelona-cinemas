<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

         latin files gets them in before first paint, so text never reflows. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="shortcut icon" href="/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" sizes="256x256" href="/apple-touch-icon.png?v=4" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=4" color="#c17f3a" />
    <meta name="theme-color" content="#faf6ef" id="theme-color-meta" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="English-language (VO) cinema showtimes across Barcelona this week — what's on, where, and when."
    />
    <meta property="og:title" content="Barcelona This Week" />
    <meta
      property="og:description"
      content="English-language (VO) cinema showtimes across Barcelona this week — what's on, where, and when."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <title>Barcelona This Week</title>
