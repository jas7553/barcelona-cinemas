AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Barcelona Movie Database — headless refresh Lambda + Node SSG renderer + static MPA on CloudFront

Parameters:

  CacheTtlHours:
    Type: Number
    Default: 12
    MinValue: 1
    MaxValue: 168
    Description: >
      Hours before cached listings are marked stale for user-facing requests.
      Must be kept in sync with ScheduleExpression so scheduled refreshes happen
      before public data stays stale for too long.

  ScheduleExpression:
    Type: String
    Default: "rate(12 hours)"
    Description: >
      EventBridge schedule for proactive cache warming. Must be kept in sync
      with CacheTtlHours. Examples: "rate(6 hours)", "cron(0 6 * * ? *)".
      If you change CacheTtlHours, change this too.

  CloudFrontDistributionId:
    Type: String
    Default: ""
    Description: >
      CloudFront distribution ID injected into Lambda for post-refresh invalidation.
      Automatically populated by deploy.sh from stack Outputs on re-deploys.
      Leave blank on first deploy.

  CloudFrontDomainName:
    Type: String
    Default: ""
    Description: >
      CloudFront domain name (e.g. d1234abcdef.cloudfront.net) injected into Lambda
      for post-refresh pre-warming. Automatically populated by deploy.sh from stack
      Outputs on re-deploys. Leave blank on first deploy.

  NotificationEmail:
    Type: String
    Description: >
      Email address subscribed to pipeline failure alerts. No default on
      purpose — set it in samconfig.toml parameter_overrides (gitignored)
      so the address is never committed.

Conditions:
  HasCloudFrontDistributionId: !Not [!Equals [!Ref CloudFrontDistributionId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64    # Graviton2: ~20% cheaper, faster cold start than x86_64.
                 # All deps are pure Python so no cross-compilation needed.
                 # If a C extension is added later, use: sam build --use-container
    Timeout: 30
    MemorySize: 1024
    # Environment variables are set on ApiFunction directly (not here) so that
    # any future functions don't inherit app-specific config by accident.

Resources:

  # ── S3: cache bucket ──────────────────────────────────────────────────────

  CacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled    # Protects against corrupt-write data loss
      LifecycleConfiguration:
        Rules:
          - Id: RetainThreeVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NewerNoncurrentVersions: 3
              NoncurrentDays: 7    # 7 days to notice and recover from a bad write

  # ── S3: frontend bucket ───────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ── Lambda ────────────────────────────────────────────────────────────────

  # Explicit log group so retention is bounded (implicit Lambda log groups
  # never expire). Custom name avoids a collision with the pre-existing
  # implicit /aws/lambda/<function> group, which CloudFormation cannot adopt.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: app.handler
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
      CodeUri: ./
      Description: Barcelona Movie Database — headless EventBridge refresh + SSG trigger
      Timeout: 120    # Verdi scrape dominates; observed p100 ~90s with 3 providers
      ReservedConcurrentExecutions: 5    # Guards against runaway invocations / bill spikes
      Environment:
        Variables:
          TMDB_SSM_PARAMETER: /barcelona-movie-db/tmdb-api-key
          LISTINGS_FEED_SSM_PARAMETER: /barcelona-movie-db/listings-feed-url
          SECONDARY_LISTINGS_SSM_PARAMETER: /barcelona-movie-db/secondary-listings-url
          CACHE_BACKEND: s3
          S3_BUCKET: !Ref CacheBucket
          S3_KEY: listings.json    # Explicit: must match the /listings.json key in IAM policy
          # Lambda env vars are strings, so stringify the numeric parameter explicitly.
          CACHE_TTL_HOURS: !Sub "${CacheTtlHours}"
          # After a refresh, publish the public listings JSON here and invoke the
          # Node SSG renderer to regenerate the static site.
          FRONTEND_BUCKET: !Ref FrontendBucket
          SSG_FUNCTION_NAME: !Ref SsgFunction
      Policies:
        - Statement:
            - Sid: CacheBucketReadWrite
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${CacheBucket.Arn}/listings.json"
              # Least-privilege: DeleteObject and ListBucket are not needed
            - Sid: PublishPublicListings
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/data/listings.json"
            - Sid: InvokeSsgRenderer
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SsgFunction.Arn
            - Sid: SsmTmdbApiKey
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/barcelona-movie-db/tmdb-api-key"
            - Sid: SsmListingsFeedUrl
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/barcelona-movie-db/listings-feed-url"
            - Sid: SsmSecondaryListingsUrl
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/barcelona-movie-db/secondary-listings-url"
            - Sid: KmsDecryptSsm
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
      Events:
        ScheduledRefresh:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: "Proactive cache warming — keep in sync with CacheTtlHours"
            Enabled: true
        WarmupPing:
          Type: Schedule
          Properties:
            Schedule: "rate(5 minutes)"
            Description: "Keep Lambda container warm between scheduled refreshes"
            Input: '{"source": "warmup"}'
            Enabled: true

  # ── Node SSG renderer Lambda ──────────────────────────────────────────────

  SsgFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ssg"
      RetentionInDays: 30

  # Headless Node renderer. Invoked (async) by ApiFunction after each refresh:
  # reads data/listings.json from the frontend bucket, re-renders every page +
  # per-film JSON back into the bucket, then invalidates CloudFront. Built files
  # (entry-server.js, render-core.mjs, template.mjs, manifest.json) are copied
  # into ssg-lambda/ by deploy.sh after `npm run build` — see its Makefile.
  SsgFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: ssg-lambda/
      Description: Barcelona Movie Database — Node SSG renderer (regenerates static pages)
      LoggingConfig:
        LogGroup: !Ref SsgFunctionLogGroup
      Timeout: 120    # Render all pages + S3 puts + CloudFront invalidation
      MemorySize: 512    # Max observed: ~200 MB; 512 has headroom without waste
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          TZ: Europe/Madrid
          FRONTEND_BUCKET: !Ref FrontendBucket
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          SITE_URL: !Sub "https://${CloudFrontDomainName}"
      Policies:
        - Statement:
            - Sid: ReadWriteFrontendBucket
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
            - Sid: CloudFrontInvalidate
              Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: !If
                - HasCloudFrontDistributionId
                - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
                - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"

  # ── CloudFront Function: clean URLs (free tier, not Lambda@Edge) ───────────

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: "Rewrite clean URLs to static .html keys (/ -> /index.html, /privacy -> /privacy.html, /film/<id> -> /film/<id>.html)"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/' || uri === '') {
            request.uri = '/index.html';
            return request;
          }
          // Map any extensionless clean URL to its static .html key:
          // /privacy -> /privacy.html, /film/<id> -> /film/<id>.html. Requests
          // that already name a file (.html/.js/.css/.json/.xml/.png/.woff2/…)
          // pass through untouched, as does the SPA-style 404 fallthrough.
          var clean = uri.replace(/\/$/, '');
          var lastSegment = clean.substring(clean.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') === -1) {
            request.uri = clean + '.html';
          }
          return request;
        }

  # ── Alerting: SNS topic + email subscription ──────────────────────────────

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors detected for the API function
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SsgErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Node SSG renderer errors detected — static site may be stale
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SsgFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RefreshFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled refresh failures detected
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Namespace: BarcelonaMovieDatabase
      MetricName: RefreshFailure
      Dimensions:
        - Name: Environment
          Value: prod
        - Name: Trigger
          Value: schedule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CacheAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Cache age exceeded configured TTL
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Namespace: BarcelonaMovieDatabase
      MetricName: CacheAgeHours
      Dimensions:
        - Name: Environment
          Value: prod
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CacheTtlHours
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Heartbeat: absence-of-signal alarm. Every other alarm only fires when code
  # runs; this one fires when nothing runs (schedule disabled, Lambda broken,
  # EMF logging dead). TreatMissingData MUST stay "breaching" — missing data
  # is the failure being detected.
  RefreshHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No successful scheduled refresh in 24h — pipeline may be dead
      Namespace: BarcelonaMovieDatabase
      MetricName: RefreshSuccess
      Dimensions:
        - Name: Environment
          Value: prod
        - Name: Trigger
          Value: schedule
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Threshold 2 over 24h ≈ same provider failed in both daily runs —
  # persistent breakage, not a transient timeout.
  ProviderDegradationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A listings provider failed in both daily refresh runs — coverage degraded
      Namespace: BarcelonaMovieDatabase
      MetricName: ProviderFailure
      Dimensions:
        - Name: Environment
          Value: prod
        - Name: Trigger
          Value: schedule
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ── CloudFront response headers: browser hardening for the static MPA ─────

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: "Security headers for the static MPA (CSP: same-origin only)."
        SecurityHeadersConfig: &securityHeaders
          ContentSecurityPolicy:
            # script-src allows: bundled JS ('self'); the inline pre-paint theme
            # script (sha256 — regenerate if scripts/template.mjs THEME_SCRIPT
            # changes); and inline speculation rules. The hydration payload is
            # inert JSON, so it needs no allowance.
            ContentSecurityPolicy: >-
              default-src 'self';
              base-uri 'self';
              connect-src 'self';
              font-src 'self';
              form-action 'self';
              frame-ancestors 'none';
              img-src 'self' data: https:;
              manifest-src 'self';
              object-src 'none';
              script-src 'self' 'sha256-UJ7YuwH97313GFUbDC38zVD8DwXulidM0MT7PafMtC0=' 'sha256-fvF722QusUuBYf8/nVfTwurnDWm/YHrPO+nPGqoQ55g=';
              style-src 'self';
              upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true

  # Same security headers as above, plus an immutable Cache-Control for the
  # content-hashed bundles (/assets/*) and frozen font files (/fonts/*).
  # Override: true so CloudFront stamps the header even though S3 objects may
  # predate the deploy.sh metadata change. The shared *securityHeaders anchor
  # keeps the hardening block from drifting between the two policies.
  StaticAssetsHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-static-assets-headers"
        Comment: "Security headers + immutable Cache-Control for content-hashed assets."
        SecurityHeadersConfig: *securityHeaders
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: "public, max-age=31536000, immutable"
              Override: true

  # ── CloudFront OAC ────────────────────────────────────────────────────────

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront distribution ───────────────────────────────────────────────

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} — static MPA"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100    # US/EU/CA only — appropriate for Barcelona audience

        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""    # Required by CFN schema even when using OAC
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id

        # Default: serve the static pages from S3. The CloudFront Function rewrites
        # clean URLs (/ → /index.html, any extensionless path → <path>.html) at the edge.
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6    # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
          AllowedMethods:
            - GET
            - HEAD

        CacheBehaviors:
          # Content-hashed bundles and frozen fonts — immutable, cache for a year
          # in the browser and at the edge. Filenames change when content changes
          # (assets); fonts must be renamed if ever swapped (see deploy.sh).
          - PathPattern: /assets/*
            TargetOriginId: FrontendS3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6    # CachingOptimized
            ResponseHeadersPolicyId: !Ref StaticAssetsHeadersPolicy
            AllowedMethods:
              - GET
              - HEAD

          - PathPattern: /fonts/*
            TargetOriginId: FrontendS3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6    # CachingOptimized
            ResponseHeadersPolicyId: !Ref StaticAssetsHeadersPolicy
            AllowedMethods:
              - GET
              - HEAD

        # S3 returns 403 (not 404) for missing objects behind OAC. Map both to
        # /404.html with a 404 response so users get a useful error page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300

Outputs:
  AppUrl:
    Description: Live app URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  DistributionId:
    Description: CloudFront distribution ID (for cache invalidations)
    Value: !Ref CloudFrontDistribution

  FrontendBucketName:
    Description: S3 bucket for Vite build output (use with aws s3 sync)
    Value: !Ref FrontendBucket

  CacheBucketName:
    Description: S3 bucket for listings.json
    Value: !Ref CacheBucket
