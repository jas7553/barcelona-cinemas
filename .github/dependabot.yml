version: 2
# Version updates are paused (open-pull-requests-limit: 0) during the redesign
# rewrite, so bumps to the old code don't churn the cutover merge. Security
# updates still arrive. Restore the limits after the cutover.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint peers on typescript <6.1.0; a TS 7 bump breaks npm ci.
      # Drop this once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
