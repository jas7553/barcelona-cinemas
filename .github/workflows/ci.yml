name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt pytest-cov

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: cfn-lint
        run: cfn-lint template.yaml

      - name: pytest
        run: pytest tests/ --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    name: Frontend (TS/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest + coverage
        run: npm run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Browsers and their system libraries come baked into the image, so a slow
    # apt mirror can't stall the job. Keep the tag in step with @playwright/test
    # in package-lock.json (a mismatch makes Playwright look for missing browsers).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      # The image's python3 lacks the project's requirements and its pip is
      # externally managed, so keep setup-python (fetched from GitHub, not apt).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pins the Node from .nvmrc rather than the image's own.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: |
          python3 -m ensurepip
          python3 -m pip install -r requirements.txt
          npm ci

      # Playwright boots the Flask API itself (playwright.config.ts webServer),
      # against the committed e2e/fixtures/listings.json — no TMDb access needed.
      # One browser per project in playwright.config.ts: mobile-chromium and
      # mobile-webkit.
      - name: Run e2e
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
