repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep in step with ruff in requirements-dev.txt
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cfn-lint
        name: cfn-lint
        entry: .venv/bin/cfn-lint template.yaml
        language: system
        files: ^template\.yaml$
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

      - id: tsc
        name: tsc
        entry: npm run legacy:typecheck
        language: system
        files: ^(src|scripts|e2e)/.*\.(ts|tsx)$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: npm run legacy:lint
        language: system
        files: ^(src|scripts|e2e)/.*\.(ts|tsx)$
        pass_filenames: false

      - id: app-check
        name: app-check
        entry: npm run check
        language: system
        files: ^(app/|package(-lock)?\.json$|eslint\.app\.config\.js$|\.dependency-cruiser\.cjs$|knip\.json$|\.prettier(rc\.json|ignore)$|stylelint\.config\.mjs$)
        pass_filenames: false
